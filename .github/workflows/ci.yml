# Assignment 6.4 - Continuous Integration
# Runs automated tests before allowing the Docker image to build.

name: RondiTrack CI

on:
  push:
    branches:
      - main
      - feature/assignment-6.4
      - feature/assignment-9.2

  pull_request:

jobs:
  frontend:
    name: Frontend (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, Africa/Johannesburg]
    env:
      TZ: ${{ matrix.timezone }}
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev

  e2e:
    name: Production browser and accessibility tests
    needs: [test, frontend]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: assignment92-test-only-postgres
      E2E_PASSWORD: assignment92-test-only-password
      API_BASE_URL: http://localhost:8080
      COMPOSE_PROJECT_NAME: assignment92-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Generate temporary secrets
        run: |
          echo "JWT_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')" >> "$GITHUB_ENV"
      - run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --build --wait
      - run: npm ci
        working-directory: web-next
      - run: npx playwright install --with-deps chromium
        working-directory: web-next
      - run: npm run build
        working-directory: web-next
      - run: npm run test:e2e
        working-directory: web-next
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web-next/playwright-report/
            web-next/test-results/
          retention-days: 7
      - if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down -v

  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Download the repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the .NET 10 SDK.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore NuGet dependencies.
      - name: Restore dependencies
        run: dotnet restore RondiTrack.Tests/RondiTrack.Tests.csproj

      # Build the application and test projects.
      - name: Build
        run: dotnet build RondiTrack.Tests/RondiTrack.Tests.csproj --no-restore --configuration Release

      # Run the automated tests.
      # GitHub-hosted Ubuntu runners support Docker for Testcontainers.
      - name: Run tests
        run: dotnet test RondiTrack.Tests/RondiTrack.Tests.csproj --no-build --configuration Release --verbosity normal

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    # Docker image building cannot begin unless the test job succeeds.
    needs: test

    steps:
      # Download the repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the production Docker image.
      - name: Build Docker image
        run: docker build -t ronditrack:ci .
