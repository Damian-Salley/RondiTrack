services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ronditrack
      POSTGRES_USER: ronditrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronditrack -d ronditrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RondiTrack: "Host=db;Port=5432;Database=ronditrack;Username=ronditrack;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: